<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="920" height="780" fill="#ffffff"/>

  <!-- ===== INTERNET BOX ===== -->
  <rect x="160" y="20" width="600" height="100" rx="12" fill="#d6f0e8" stroke="#5aab8a" stroke-width="2"/>
  <text x="460" y="55" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a6644">Internet</text>
  <text x="460" y="78" text-anchor="middle" font-size="13" fill="#2e7d5a">Web Servers · DNS Servers · Remote Hosts</text>
  <text x="460" y="98" text-anchor="middle" font-size="13" fill="#2e7d5a">DNS :53 · HTTP :80 · HTTPS :443 · ICMP · TCP/UDP</text>

  <!-- Arrow: Internet → Router -->
  <line x1="460" y1="120" x2="460" y2="168" stroke="#555" stroke-width="1.5"/>
  <polygon points="460,172 455,162 465,162" fill="#555"/>
  <text x="475" y="150" font-size="12" fill="#555">all frames</text>

  <!-- ===== ROUTER / SWITCH BOX ===== -->
  <rect x="210" y="172" width="500" height="80" rx="12" fill="#f0ece0" stroke="#b0a070" stroke-width="2"/>
  <text x="460" y="205" text-anchor="middle" font-size="17" font-weight="bold" fill="#5a4a10">Router / Switch</text>
  <text x="460" y="228" text-anchor="middle" font-size="13" fill="#7a6a30">Home network or lab network — forwards all frames</text>

  <!-- Arrow: Router → NIC -->
  <line x1="460" y1="252" x2="460" y2="300" stroke="#555" stroke-width="1.5"/>
  <polygon points="460,304 455,294 465,294" fill="#555"/>
  <text x="475" y="282" font-size="12" fill="#555">raw packets</text>

  <!-- ===== NIC BOX ===== -->
  <rect x="160" y="304" width="600" height="95" rx="12" fill="#dce8f8" stroke="#5a82c8" stroke-width="2"/>
  <text x="460" y="338" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a3a7a">Network Interface Card (NIC)</text>
  <text x="460" y="362" text-anchor="middle" font-size="13" fill="#2a4a9a">Promiscuous mode — captures ALL packets on the network</text>
  <text x="460" y="382" text-anchor="middle" font-size="13" fill="#2a4a9a">not just packets addressed to your machine</text>

  <!-- Arrow: NIC → Wireshark -->
  <line x1="460" y1="399" x2="460" y2="447" stroke="#7a5ab0" stroke-width="1.5"/>
  <polygon points="460,451 455,441 465,441" fill="#7a5ab0"/>
  <text x="475" y="430" font-size="12" fill="#7a5ab0">decoded frames</text>

  <!-- ===== WIRESHARK BOX ===== -->
  <rect x="160" y="451" width="600" height="95" rx="12" fill="#e8e0f8" stroke="#8a60c8" stroke-width="2"/>
  <text x="460" y="485" text-anchor="middle" font-size="17" font-weight="bold" fill="#4a1a8a">Wireshark</text>
  <text x="460" y="508" text-anchor="middle" font-size="13" fill="#5a2a9a">Decodes every packet · applies display filters · reassembles streams</text>
  <text x="460" y="528" text-anchor="middle" font-size="13" fill="#5a2a9a">reads every layer from Ethernet frame to application payload</text>

  <!-- Arrow: Wireshark → pipeline (down) -->
  <line x1="460" y1="546" x2="460" y2="590" stroke="#c07820" stroke-width="1.5"/>
  <polygon points="460,594 455,584 465,584" fill="#c07820"/>
  <text x="475" y="574" font-size="12" fill="#c07820">analysis pipeline</text>

  <!-- Horizontal line for pipeline -->
  <line x1="100" y1="594" x2="820" y2="594" stroke="#c07820" stroke-width="1.5"/>

  <!-- Left arrows from horizontal line -->
  <line x1="140" y1="594" x2="140" y2="618" stroke="#c07820" stroke-width="1.5"/>
  <polygon points="140,622 135,612 145,612" fill="#c07820"/>

  <line x1="310" y1="594" x2="310" y2="618" stroke="#c07820" stroke-width="1.5"/>
  <polygon points="310,622 305,612 315,612" fill="#c07820"/>

  <!-- Right arrows from horizontal line -->
  <line x1="610" y1="594" x2="610" y2="618" stroke="#c07820" stroke-width="1.5"/>
  <polygon points="610,622 605,612 615,612" fill="#c07820"/>

  <line x1="780" y1="594" x2="780" y2="618" stroke="#c07820" stroke-width="1.5"/>
  <polygon points="780,622 775,612 785,612" fill="#c07820"/>

  <!-- ===== PIPELINE BOXES ===== -->
  <!-- Capture -->
  <rect x="50" y="622" width="180" height="90" rx="10" fill="#fce8c0" stroke="#c07820" stroke-width="2"/>
  <text x="140" y="652" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4a00">Capture</text>
  <text x="140" y="674" text-anchor="middle" font-size="12" fill="#7a4a00">Live traffic</text>
  <text x="140" y="692" text-anchor="middle" font-size="12" fill="#7a4a00">or .pcapng file</text>

  <!-- Filter -->
  <rect x="220" y="622" width="180" height="90" rx="10" fill="#fce8c0" stroke="#c07820" stroke-width="2"/>
  <text x="310" y="652" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4a00">Filter</text>
  <text x="310" y="674" text-anchor="middle" font-size="12" fill="#7a4a00">dns / ip.addr</text>
  <text x="310" y="692" text-anchor="middle" font-size="12" fill="#7a4a00">tcp / http</text>

  <!-- Analyse -->
  <rect x="520" y="622" width="180" height="90" rx="10" fill="#fce8c0" stroke="#c07820" stroke-width="2"/>
  <text x="610" y="652" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4a00">Analyse</text>
  <text x="610" y="674" text-anchor="middle" font-size="12" fill="#7a4a00">Protocols</text>
  <text x="610" y="692" text-anchor="middle" font-size="12" fill="#7a4a00">and streams</text>

  <!-- Export -->
  <rect x="690" y="622" width="180" height="90" rx="10" fill="#fce8c0" stroke="#c07820" stroke-width="2"/>
  <text x="780" y="652" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4a00">Export</text>
  <text x="780" y="674" text-anchor="middle" font-size="12" fill="#7a4a00">.pcapng file</text>
  <text x="780" y="692" text-anchor="middle" font-size="12" fill="#7a4a00">for portfolio</text>

  <!-- ===== LEGEND ===== -->
  <rect x="50" y="735" width="18" height="18" rx="3" fill="#d6f0e8" stroke="#5aab8a" stroke-width="1.5"/>
  <text x="75" y="749" font-size="12" fill="#333">Network traffic</text>

  <rect x="230" y="735" width="18" height="18" rx="3" fill="#dce8f8" stroke="#5a82c8" stroke-width="1.5"/>
  <text x="255" y="749" font-size="12" fill="#333">Capture layer</text>

  <rect x="400" y="735" width="18" height="18" rx="3" fill="#e8e0f8" stroke="#8a60c8" stroke-width="1.5"/>
  <text x="425" y="749" font-size="12" fill="#333">Wireshark engine</text>

  <rect x="600" y="735" width="18" height="18" rx="3" fill="#fce8c0" stroke="#c07820" stroke-width="1.5"/>
  <text x="625" y="749" font-size="12" fill="#333">Analysis pipeline</text>

</svg>
